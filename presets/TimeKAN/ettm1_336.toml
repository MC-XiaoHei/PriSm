[run]
model = "TimeKAN"
train_epochs = 10
patience = 10
batch_size = 32
learning_rate = 0.01
lradj = "type1"

[data]
data = "ETTm1"
root_path = "./dataset/ETT-small"
data_path = "ETTm1.csv"
features = "M"
freq = "t"

[model]
seq_len = 96
label_len = 48
pred_len = 336
freq = "h"
begin_order = 1
channel_independence = 1
d_model = 16
down_sampling_layers = 2
down_sampling_window = 2
dropout = 0.1
e_layers = 2
embed = "timeF"
moving_avg = 25
use_future_temporal_feature = 0
use_norm = 1
