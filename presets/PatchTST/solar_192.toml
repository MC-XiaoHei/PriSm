[run]
model = "PatchTST"
train_epochs = 10
patience = 3
batch_size = 32
learning_rate = 0.0001
lradj = "type1"

[data]
data = "Solar"
root_path = "./dataset/Solar"
data_path = "solar_AL.txt"
features = "M"
freq = "h"

[model]
seq_len = 96
label_len = 48
pred_len = 192
freq = "h"
activation = "gelu"
d_ff = 2048
d_model = 512
dropout = 0.1
e_layers = 1
factor = 1
n_heads = 8
