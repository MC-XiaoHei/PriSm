[run]
model = "iTransformer"
train_epochs = 10
patience = 3
batch_size = 32
learning_rate = 0.0001
lradj = "type1"

[data]
data = "Weather"
root_path = "./dataset/weather"
data_path = "weather.csv"
features = "M"
freq = "h"

[model]
seq_len = 96
label_len = 48
pred_len = 720
freq = "h"
activation = "gelu"
d_ff = 128
d_model = 128
dropout = 0.1
e_layers = 2
embed = "timeF"
factor = 1
n_heads = 8
