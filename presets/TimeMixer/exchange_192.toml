[run]
model = "TimeMixer"
train_epochs = 10
patience = 10
batch_size = 128
learning_rate = 0.01
lradj = "type1"

[data]
data = "Exchange"
root_path = "./dataset/exchange_rate"
data_path = "exchange_rate.csv"
features = "M"
freq = "h"

[model]
seq_len = 96
label_len = 48
pred_len = 192
freq = "h"
channel_independence = 1
d_ff = 32
d_model = 16
decomp_method = "moving_avg"
down_sampling_layers = 3
down_sampling_method = "avg"
down_sampling_window = 2
dropout = 0.1
e_layers = 2
embed = "timeF"
moving_avg = 25
top_k = 5
use_norm = 1
