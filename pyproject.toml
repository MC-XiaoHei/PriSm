[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch==2.3.0",
    "numpy>=1.24,<2",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3",
    "psutil>=5.9",
    "einops>=0.8",
    "tqdm>=4.70",
]

[project.scripts]
prism = "prism.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.pyright]
include = ["src/prism"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
